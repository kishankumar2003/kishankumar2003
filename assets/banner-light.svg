<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Dasari Kishan Kumar</title>
  <desc id="d">Dasari Kishan Kumar, Offensive Security Consultant at Protiviti. An attack path runs from Recon through Initial Access and Lateral Movement to Domain Admin.</desc>
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#eaeef2" stroke-width="1"/></pattern>
    <radialGradient id="rglow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff8182" stop-opacity="0.18"/><stop offset="1" stop-color="#ff8182" stop-opacity="0"/></radialGradient>
    <clipPath id="card"><rect width="900" height="300" rx="14"/></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .nlabel { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 11px; fill: #6e7781; }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="900" height="300" fill="#ffffff"/>
    <rect width="900" height="300" fill="url(#grid)"/>
    <ellipse cx="820" cy="205" rx="150" ry="120" fill="url(#rglow)"/>
  </g>
  <rect x="0.5" y="0.5" width="899" height="299" rx="14" fill="none" stroke="#d0d7de"/>

  <text x="46" y="92" class="mono" font-size="13" fill="#6e7781"><tspan fill="#cf222e">root@protiviti</tspan>:<tspan fill="#0969da">~</tspan>$ ./operator --profile<tspan fill="#cf222e">&#9613;<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
  <text x="44" y="140" class="sans" font-size="38" font-weight="700" fill="#1f2328">Dasari Kishan Kumar</text>
  <text x="46" y="172" class="sans" font-size="16" fill="#424a53">Offensive Security Consultant @ Protiviti</text>
  <text x="46" y="200" class="mono" font-size="12.5" fill="#6e7781">red team &#183; pentest &#183; app &amp; cloud security &#183; Coimbatore, India</text>

  <!-- attack path -->
  <path id="ap" d="M470,250 L580,250 L690,250 L800,250" fill="none" stroke="#d0d7de" stroke-width="2"/>
  <path d="M470,250 L800,250" fill="none" stroke="#cf222e" stroke-width="2" stroke-dasharray="14 320" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" values="334;0" dur="2.6s" repeatCount="indefinite"/>
  </path>

  <g class="nlabel" text-anchor="middle">
    <g>
      <circle cx="470" cy="250" r="8" fill="#ffffff" stroke="#1b7c83" stroke-width="2"/>
      <text x="470" y="232" fill="#1b7c83">recon</text>
    </g>
    <g>
      <circle cx="580" cy="250" r="8" fill="#ffffff" stroke="#8250df" stroke-width="2"/>
      <text x="580" y="278">access</text>
    </g>
    <g>
      <circle cx="690" cy="250" r="8" fill="#ffffff" stroke="#9a6700" stroke-width="2"/>
      <text x="690" y="232">lateral</text>
    </g>
    <g>
      <circle cx="800" cy="250" r="10" fill="#cf222e">
        <animate attributeName="r" values="10;13;10" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="fill-opacity" values="1;0.75;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="800" y="278" fill="#cf222e">domain admin</text>
    </g>
  </g>
</svg>
